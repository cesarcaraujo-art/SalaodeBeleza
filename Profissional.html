<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Profissional PWA</title>

  <link rel="manifest" href="/manifest-prof.json">
  <meta name="theme-color" content="#8e3a59">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #fdfaf9; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; background: #fff; padding: 25px; border-radius: 16px; border: 1px solid #f7edee; }
    h1, h2 { text-align: center; margin-bottom: 20px; color: #8e3a59; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e0ccd2; margin-bottom: 12px; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: #fdf8f9; border: 1px solid #e0ccd2; border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; }
    .tab-btn.active { background: #8e3a59; color: #fff; }

    .metrics-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 10px; margin-bottom: 20px; }
    .metric-card { background: #fdf8f9; border: 1px solid #f0e4e8; padding: 15px; border-radius: 10px; text-align: center; }
    .metric-card h3 { font-size: 0.85rem; color: #666; }
    .metric-card p { font-size: 1.3rem; font-weight: bold; color: #15803d; }

    .agenda-card { background: #fdf8f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #8e3a59; }
    #loginSection, #panelSection { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div id="loginSection" style="display: block;">
    <h1>Portal da Profissional</h1>
    <form onsubmit="realizarLogin(event)">
      <label>Nome:</label>
      <select id="loginProfSelect" required></select>
      <label>Senha:</label>
      <input type="password" id="loginPass" placeholder="••••••••" required>
      <button style="width:100%; padding:12px; background:#8e3a59; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Entrar no Meu Painel</button>
    </form>
  </div>

  <div id="panelSection">
    <h2 id="profWelcome">Minha Agenda</h2>

    <div class="nav-tabs">
      <div class="tab-btn active" onclick="trocarAba('agendaTab', this)">📅 Minha Agenda</div>
      <div class="tab-btn" onclick="trocarAba('ganhosTab', this)">💰 Meus Ganhos</div>
    </div>

    <div id="agendaTab" class="tab-content">
      <div id="listaMinhaAgenda"></div>
    </div>

    <div id="ganhosTab" class="tab-content" style="display: none;">
      <div class="metrics-grid">
        <div class="metric-card"><h3>Minhas Comissões</h3><p id="meuGanhoTotal">R$ 0,00</p></div>
      </div>
      <div id="listaMeusGanhos"></div>
    </div>
  </div>
</div>

<script>
  let profLogada = null;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

  async function carregarProfissionais() {
    try {
      const res = await fetch('/api/barbeiros');
      const data = await res.json();
      if (!data.offline) localStorage.setItem('barbeiros', JSON.stringify(data));
    } catch(e){}

    const barbeiros = JSON.parse(localStorage.getItem('barbeiros')) || [];
    const select = document.getElementById('loginProfSelect');
    select.innerHTML = '<option value="">Selecione quem é você...</option>';
    barbeiros.forEach(b => select.innerHTML += `<option value="${b.nome}">${b.nome}</option>`);
  }

  async function sincronizarECarregar() {
    try {
      const res = await fetch('/api/agendamentos');
      const data = await res.json();
      if (!data.offline) localStorage.setItem('agendamentos', JSON.stringify(data));
    } catch(e){}

    const agendamentos = JSON.parse(localStorage.getItem('agendamentos')) || [];
    const meusAgendamentos = agendamentos.filter(a => a.barbeiro === profLogada);

    const containerA = document.getElementById('listaMinhaAgenda');
    const containerG = document.getElementById('listaMeusGanhos');
    containerA.innerHTML = ''; containerG.innerHTML = '';
    let totalComissao = 0;

    meusAgendamentos.forEach(a => {
      const valor = parseFloat(a.preco || 0);
      const pct = a.pctProfissional !== undefined ? a.pctProfissional : 40;
      const comissao = (valor * pct) / 100;
      totalComissao += comissao;

      containerA.innerHTML += `<div class="agenda-card"><b>${a.hora} hs - ${a.data}</b><br>${a.cliente} (${a.servico})<br><small>Whats: ${a.whats}</small></div>`;
      containerG.innerHTML += `<div class="agenda-card" style="border-left-color:#15803d;"><b>${a.servico} (${a.cliente})</b><br><small style="color:#15803d;">+ R$ ${comissao.toFixed(2)} (${pct}%)</small></div>`;
    });

    document.getElementById('meuGanhoTotal').innerText = `R$ ${totalComissao.toFixed(2)}`;
  }

  function trocarAba(abaId, element) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(abaId).style.display = 'block';
    element.classList.add('active');
  }

  function realizarLogin(e) {
    e.preventDefault();
    const nome = document.getElementById('loginProfSelect').value;
    const senha = document.getElementById('loginPass').value.trim();
    const senhas = JSON.parse(localStorage.getItem('senhasProfissionais')) || {};

    if (senha === (senhas[nome] || '1234')) {
      profLogada = nome;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('panelSection').style.display = 'block';
      document.getElementById('profWelcome').innerText = `👋 Olá, ${nome}`;
      sincronizarECarregar();
    } else { alert('Senha incorreta!'); }
  }

  window.addEventListener('DOMContentLoaded', carregarProfissionais);
</script>
</body>
</html>
