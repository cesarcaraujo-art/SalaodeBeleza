<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento - Studio & Salão de Beleza</title>

  <link rel="manifest" href="/manifest-cliente.json">
  <meta name="theme-color" content="#8e3a59">
  
  <style>
    :root { --primary-color: #8e3a59; --bg-color: #fdfaf9; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html { scroll-behavior: smooth; }
    body { background-color: var(--bg-color); color: #333; padding-top: 70px; user-select: none; }
    header.navbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: #fff; border-bottom: 1px solid #f0e4e8; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; }
    .navbar-brand { font-size: 1.3rem; font-weight: bold; color: var(--primary-color); text-decoration: none; }
    .container { max-width: 900px; width: 90%; margin: 30px auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
    h1, h2, h3 { text-align: center; margin-bottom: 20px; color: var(--primary-color); }
    .step { margin-bottom: 30px; background: #fdf8f9; padding: 20px; border-radius: 12px; border: 1px solid #f2e2e6; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e0ccd2; background: #fff; margin-bottom: 15px; font-size: 1rem; }
    .barbeiros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }
    .barbeiro-card { background: #fff; border: 2px solid #f2e2e6; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; }
    .barbeiro-card.selected { border-color: var(--primary-color); background: #fbf0f3; }
    .barbeiro-card img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; border: 2px solid var(--primary-color); }
    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
    .slot-btn { padding: 10px; background: #fff; border: 1px solid #e0ccd2; color: #444; border-radius: 8px; cursor: pointer; }
    .slot-btn.selected { background: var(--primary-color); color: #fff; font-weight: bold; }
    .slot-btn:disabled { background: #f5f5f5; color: #aaa; cursor: not-allowed; }
    button.submit-btn { width: 100%; padding: 15px; background: var(--primary-color); color: #fff; border: none; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .confirmation-box { display: none; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 20px; border-radius: 12px; margin-top: 20px; }
  </style>
</head>
<body>

<header class="navbar">
  <a href="#" class="navbar-brand">✨ Studio & Salão PWA</a>
</header>

<div class="container" id="home">
  <section style="text-align: center; margin-bottom: 30px;">
    <h1>Agende seu Horário</h1>
    <p style="color:#777;">Funciona no App PWA e Sincroniza em Tempo Real</p>
  </section>

  <div class="step">
    <h2>1. Escolha a Profissional</h2>
    <div class="barbeiros-grid" id="barbeirosGrid"></div>
  </div>

  <div class="step">
    <h2>2. Escolha o Serviço</h2>
    <select id="servicoSelect"><option value="">Selecione uma profissional...</option></select>
  </div>

  <div class="step">
    <h2>3. Data e Horário</h2>
    <input type="date" id="dataSelect" onchange="gerarHorarios()">
    <div class="slots-grid" id="slotsGrid"></div>
  </div>

  <div class="step">
    <h2>4. Seus Dados</h2>
    <input type="text" id="nomeCliente" placeholder="Seu Nome Completo">
    <input type="email" id="emailCliente" placeholder="Seu E-mail">
    <input type="text" id="whatsCliente" placeholder="Seu WhatsApp (Ex: 13999999999)">
    <button class="submit-btn" onclick="confirmarAgendamento()">Confirmar Agendamento</button>
  </div>

  <div class="confirmation-box" id="confirmationBox">
    <h3 style="color: #15803d;">✅ Agendamento Confirmado!</h3>
    <p id="detailsText" style="margin-top:10px;"></p>
  </div>
</div>

<script>
  let barbeiroSelecionadoObj = null;
  let horarioSelecionado = '';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }

  async function carregarBarbeirosSync() {
    try {
      const res = await fetch('/api/barbeiros');
      const data = await res.json();
      if (!data.offline) localStorage.setItem('barbeiros', JSON.stringify(data));
    } catch(e){}

    const barbeiros = JSON.parse(localStorage.getItem('barbeiros')) || [];
    const grid = document.getElementById('barbeirosGrid');
    grid.innerHTML = '';
    
    barbeiros.forEach(b => {
      const card = document.createElement('div');
      card.className = 'barbeiro-card';
      card.onclick = () => {
        document.querySelectorAll('.barbeiro-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        barbeiroSelecionadoObj = b;
        carregarServicosDoBarbeiro(b.id || b._id);
        gerarHorarios();
      };
      card.innerHTML = `<img src="${b.foto || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}"><div>${b.nome}</div>`;
      grid.appendChild(card);
    });
  }

  function carregarServicosDoBarbeiro(id) {
    const configServicos = JSON.parse(localStorage.getItem('servicosPorBarbeiro')) || {};
    const list = configServicos[id] || [{ id:1, nome: 'Escova', preco: 60, pctProfissional: 40 }];
    const select = document.getElementById('servicoSelect');
    select.innerHTML = '<option value="">Selecione...</option>';
    list.forEach(s => {
      select.innerHTML += `<option value="${s.nome}|${s.preco}|${s.pctProfissional || 40}">${s.nome} - R$ ${s.preco.toFixed(2)}</option>`;
    });
  }

  async function gerarHorarios() {
    const grid = document.getElementById('slotsGrid');
    const dataVal = document.getElementById('dataSelect').value;
    if (!dataVal || !barbeiroSelecionadoObj) return;

    try {
      const res = await fetch('/api/agendamentos');
      const apiAgendamentos = await res.json();
      if (!apiAgendamentos.offline) localStorage.setItem('agendamentos', JSON.stringify(apiAgendamentos));
    } catch(e){}

    const agendamentos = JSON.parse(localStorage.getItem('agendamentos')) || [];
    const ocupados = agendamentos.filter(a => a.data === dataVal && a.barbeiro === barbeiroSelecionadoObj.nome).map(a => a.hora);
    const horarios = ['08:00', '09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00', '17:00'];

    grid.innerHTML = '';
    horarios.forEach(h => {
      const btn = document.createElement('button');
      btn.className = 'slot-btn';
      if (ocupados.includes(h)) {
        btn.innerText = `${h} (Ocupado)`;
        btn.disabled = true;
      } else {
        btn.innerText = h;
        btn.onclick = () => {
          document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          horarioSelecionado = h;
        };
      }
      grid.appendChild(btn);
    });
  }

  async function confirmarAgendamento() {
    const servicoVal = document.getElementById('servicoSelect').value;
    const data = document.getElementById('dataSelect').value;
    const nome = document.getElementById('nomeCliente').value;
    const whats = document.getElementById('whatsCliente').value;

    if (!barbeiroSelecionadoObj || !servicoVal || !data || !horarioSelecionado || !nome || !whats) {
      return alert('Preencha todos os campos!');
    }

    const [servicoNome, servicoPreco, pct] = servicoVal.split('|');
    const novoAgendamento = {
      id: Date.now().toString(),
      cliente: nome,
      whats: whats.replace(/\D/g, ''),
      barbeiro: barbeiroSelecionadoObj.nome,
      servico: servicoNome,
      preco: parseFloat(servicoPreco),
      pctProfissional: parseFloat(pct),
      data,
      hora: horarioSelecionado
    };

    const agendamentos = JSON.parse(localStorage.getItem('agendamentos')) || [];
    agendamentos.push(novoAgendamento);
    localStorage.setItem('agendamentos', JSON.stringify(agendamentos));

    try {
      await fetch('/api/enviar-email-confirmacao', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(novoAgendamento)
      });
    } catch(e){}

    document.getElementById('detailsText').innerText = `Agendado para ${data.split('-').reverse().join('/')} às ${horarioSelecionado}hs com ${barbeiroSelecionadoObj.nome}.`;
    document.getElementById('confirmationBox').style.display = 'block';
    gerarHorarios();
  }

  window.addEventListener('DOMContentLoaded', carregarBarbeirosSync);
</script>
</body>
</html>
