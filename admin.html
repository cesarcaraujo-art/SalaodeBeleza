<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Salão - Gestão Geral (Dono)</title>

  <link rel="manifest" href="/manifest-admin.json">
  <meta name="theme-color" content="#8e3a59">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #fdfaf9; color: #333333; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); border: 1px solid #f7edee; }
    h1, h2 { text-align: center; margin-bottom: 20px; color: #8e3a59; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 0.9rem; }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"], select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #e0ccd2; background: #ffffff; color: #333; margin-bottom: 12px; font-size: 0.95rem; }
    
    .nav-tabs { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 20px; 
      border-bottom: 1px solid #f0e4e8; 
      padding-bottom: 12px; 
      overflow-x: auto; 
      white-space: nowrap;
      -webkit-overflow-scrolling: touch; 
    }
    .tab-btn { 
      flex: 0 0 auto;            
      padding: 10px 14px;        
      background: #fdf8f9; 
      border: 1px solid #e0ccd2; 
      color: #666; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold; 
      text-align: center; 
      font-size: 0.85rem; 
      transition: 0.2s; 
      white-space: nowrap;       
    }
    .tab-btn.active { 
      background: #8e3a59; 
      color: #ffffff; 
      border-color: #8e3a59; 
    }

    button { cursor: pointer; transition: 0.2s; font-weight: bold; width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 0.95rem; }
    .btn-primary { background: #8e3a59; color: #ffffff; }
    .btn-danger { background: #dc2626; color: #fff; width: auto; padding: 6px 12px; font-size: 0.85rem; }
    .btn-add { background: #15803d; color: #fff; margin-top: 5px; }
    
    .admin-card { background: #fdf8f9; border: 1px dashed #8e3a59; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .item-row { display: flex; gap: 8px; align-items: center; background: #ffffff; border: 1px solid #f0e4e8; padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; }
    .item-row img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #8e3a59; }
    
    .agenda-card { background: #fdf8f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #8e3a59; position: relative; }
    .agenda-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; color: #8e3a59; padding-right: 25px; }
    .btn-delete-x { position: absolute; top: 12px; right: 12px; background: transparent; color: #dc2626; border: none; font-size: 1.1rem; cursor: pointer; }

    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .metric-card { background: #fdf8f9; border: 1px solid #f0e4e8; padding: 12px; border-radius: 10px; text-align: center; }
    .metric-card h3 { font-size: 0.8rem; color: #666; margin-bottom: 5px; }
    .metric-card p { font-size: 1.2rem; font-weight: bold; color: #8e3a59; }

    #loginSection, #adminPanel { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div id="loginSection" style="display: block;">
    <h1>Painel do Estabelecimento (Dono)</h1>
    <form onsubmit="realizarLogin(event)">
      <label>Usuário:</label>
      <input type="text" id="loginUser" placeholder="admin" required>
      <label>Senha do Dono:</label>
      <input type="password" id="loginPass" placeholder="••••••••" required>
      <button type="submit" class="btn-primary">Entrar como Administrador</button>
    </form>
  </div>

  <div id="adminPanel">
    <h2>⚙️ Gestão Geral do Salão</h2>

    <div class="nav-tabs">
      <div class="tab-btn active" onclick="trocarAba('agendaTab', this)">📅 Agenda Geral</div>
      <div class="tab-btn" onclick="trocarAba('faturamentoTab', this)">📊 Faturamento</div>
      <div class="tab-btn" onclick="trocarAba('perfilTab', this)">👤 Equipe & Senhas</div>
    </div>

    <div id="agendaTab" class="tab-content">
      <div id="listaAgendamentos"></div>
    </div>

    <div id="faturamentoTab" class="tab-content" style="display: none;">
      <div class="metrics-grid">
        <div class="metric-card"><h3>Total Bruto</h3><p id="fatTotalBruto">R$ 0,00</p></div>
        <div class="metric-card"><h3>Comissões Equipe</h3><p id="fatComissaoProf" style="color: #15803d;">R$ 0,00</p></div>
        <div class="metric-card"><h3>Lucro do Salão</h3><p id="fatParteDono" style="color: #8e3a59;">R$ 0,00</p></div>
      </div>
      <div id="listaHistoricoVendas"></div>
    </div>

    <div id="perfilTab" class="tab-content" style="display: none;">
      <div class="admin-card">
        <label>Cadastrar Nova Profissional:</label>
        <input type="text" id="newNome" placeholder="Nome da Profissional">
        <input type="password" id="newSenhaProf" placeholder="Senha (Padrão: 1234)">
        <button class="btn-add" onclick="adicionarBarbeiro()">+ Cadastrar Profissional</button>
      </div>
      <div id="adminList"></div>
    </div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

  async function sincronizarDadosGET() {
    try {
      const resA = await fetch('/api/agendamentos');
      const dataA = await resA.json();
      if (!dataA.offline) localStorage.setItem('agendamentos', JSON.stringify(dataA));

      const resB = await fetch('/api/barbeiros');
      const dataB = await resB.json();
      if (!dataB.offline) localStorage.setItem('barbeiros', JSON.stringify(dataB));
    } catch(e){}

    renderizarAgenda();
    renderizarFaturamento();
    renderizarBarbeiros();
  }

  function trocarAba(abaId, element) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(abaId).style.display = 'block';
    element.classList.add('active');
  }

  function renderizarAgenda() {
    const list = JSON.parse(localStorage.getItem('agendamentos')) || [];
    const container = document.getElementById('listaAgendamentos');
    container.innerHTML = '';
    list.forEach(a => {
      container.innerHTML += `
        <div class="agenda-card">
          <div class="agenda-header"><span>🕒 ${a.hora} hs - ${a.data}</span><span>💅 ${a.barbeiro}</span></div>
          <div><b>Cliente:</b> ${a.cliente} (${a.servico})</div>
          <div>📱 Whats: ${a.whats}</div>
        </div>
      `;
    });
  }

  function renderizarFaturamento() {
    const agendamentos = JSON.parse(localStorage.getItem('agendamentos')) || [];
    let bruto = 0, comissao = 0, dono = 0;
    const container = document.getElementById('listaHistoricoVendas');
    container.innerHTML = '';

    agendamentos.forEach(a => {
      const valor = parseFloat(a.preco || 0);
      const pct = a.pctProfissional !== undefined ? a.pctProfissional : 40;
      const vProf = (valor * pct) / 100;
      const vDono = valor - vProf;

      bruto += valor; comissao += vProf; dono += vDono;

      container.innerHTML += `
        <div class="agenda-card">
          <b>${a.servico}</b> - R$ ${valor.toFixed(2)}<br>
          <small style="color:#15803d;">💰 Profissional (${pct}%): R$ ${vProf.toFixed(2)}</small> | 
          <small style="color:#8e3a59;">🏢 Salão/Dono: R$ ${vDono.toFixed(2)}</small>
        </div>
      `;
    });

    document.getElementById('fatTotalBruto').innerText = `R$ ${bruto.toFixed(2)}`;
    document.getElementById('fatComissaoProf').innerText = `R$ ${comissao.toFixed(2)}`;
    document.getElementById('fatParteDono').innerText = `R$ ${dono.toFixed(2)}`;
  }

  function adicionarBarbeiro() {
    const nome = document.getElementById('newNome').value.trim();
    const senha = document.getElementById('newSenhaProf').value.trim() || '1234';
    if (!nome) return;

    const barbeiros = JSON.parse(localStorage.getItem('barbeiros')) || [];
    barbeiros.push({ id: Date.now(), nome });
    localStorage.setItem('barbeiros', JSON.stringify(barbeiros));

    const senhas = JSON.parse(localStorage.getItem('senhasProfissionais')) || {};
    senhas[nome] = senha;
    localStorage.setItem('senhasProfissionais', JSON.stringify(senhas));

    alert('Profissional cadastrada!');
    document.getElementById('newNome').value = '';
    document.getElementById('newSenhaProf').value = '';
    sincronizarDadosGET();
  }

  function renderizarBarbeiros() {
    const list = JSON.parse(localStorage.getItem('barbeiros')) || [];
    const container = document.getElementById('adminList');
    container.innerHTML = '';
    list.forEach(b => {
      container.innerHTML += `<div class="item-row"><b>${b.nome}</b></div>`;
    });
  }

  function realizarLogin(e) {
    e.preventDefault();
    if (document.getElementById('loginUser').value === 'admin' && document.getElementById('loginPass').value === (localStorage.getItem('adminSenha') || '1234')) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      sincronizarDadosGET();
    } else { alert('Senha incorreta!'); }
  }
</script>
</body>
</html>
